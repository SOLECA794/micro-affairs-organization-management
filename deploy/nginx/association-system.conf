# =============================================================
# Nginx 站点配置模板（部署阶段使用）
# 部署形态（02 文档 §6）：Nginx 80 端口托管前端静态资源 + /api 反代 127.0.0.1:8080
# 放置：/etc/nginx/conf.d/association-system.conf
# =============================================================

server {
    listen      80;
    server_name _;           # 暂无域名，HTTP 演示环境；后续接入域名后改写并补证书

    # 前端静态资源（React 构建产物 dist/ 上传至该目录）
    root  /opt/association-system/web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 反向代理到本机 Spring Boot
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # Excel 导出等大响应缓冲
    location /api/manager/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering    on;
    }

    # SPA 路由回退：前端路由（/activities、/manager/... 等）交由 index.html 处理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
