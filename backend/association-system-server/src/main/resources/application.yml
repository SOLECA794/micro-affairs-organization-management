# =============================================================
# 默认配置（本地开发）
# 生产环境使用 application-prod.yml + 环境变量（见 deploy/README.md）
# =============================================================
server:
  port: 8080
  address: 127.0.0.1
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: association-system-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/association_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 10000
  jackson:
    # 全局时间序列化（04 文档：yyyy-MM-dd HH:mm:ss）
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义配置项
assoc:
  jwt:
    # HS256 密钥，长度不得少于 32 字节；生产通过环境变量 JWT_SECRET 覆盖
    secret: dev-only-secret-key-change-me-in-prod-0123456789
    expire-hours: 24
  qrcode:
    # 二维码内容基地址（指向后端扫码落地页）；生产通过环境变量覆盖
    base-url: http://127.0.0.1:8080
  front:
    # 扫码落地页 302 跳转的前端基地址
    base-url: http://127.0.0.1:5173

logging:
  level:
    root: info
    com.assoc: debug
