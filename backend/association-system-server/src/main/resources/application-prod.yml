# =============================================================
# 生产配置模板（外置部署使用，见 deploy/）
# 启动：java 17 全路径 -jar association-system-server.jar --spring.profiles.active=prod
# 敏感项一律走环境变量（deploy/assoc-server.service 通过 EnvironmentFile 注入）：
#   DB_URL / DB_USERNAME / DB_PASSWORD / JWT_SECRET / QRCODE_BASE_URL / FRONT_BASE_URL
# =============================================================
server:
  port: 8080
  address: 127.0.0.1   # 仅监听本机，由 Nginx 反代对外

spring:
  application:
    name: association-system-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/association_system?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:association}
    password: ${DB_PASSWORD:change-me}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 10000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

assoc:
  jwt:
    # 生产必须通过环境变量 JWT_SECRET 注入（不少于 32 字节随机串）
    secret: ${JWT_SECRET:}
    expire-hours: 24
  qrcode:
    # 二维码基地址：部署后回填真实地址（当前为 HTTP 演示环境，见 README 待确认事项）
    base-url: ${QRCODE_BASE_URL:http://114.55.31.135}
  front:
    base-url: ${FRONT_BASE_URL:http://114.55.31.135}

logging:
  level:
    root: info
    com.assoc: info
  file:
    name: /var/log/association-system/server.log
